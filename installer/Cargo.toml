[package]
name = "soundya-installer"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "Installs soundya on a Yandex Station: a step-by-step wizard in the browser"
publish = false

# Standalone: the speaker's own crate is not built for Windows or macOS.
[workspace]

[dependencies]
serde_json = "1"

[features]
# The developer build: the wizard with the feedback mode, installs the speaker's
# developer build (dist/soundya-armv7-dev.tar). None of it is in the normal build.
dev = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
