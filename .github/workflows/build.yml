name: Build soundya

"on":
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  arm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-arm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: soundya-armv7
          path: dist/soundya-armv7.tar.gz
          if-no-files-found: error
